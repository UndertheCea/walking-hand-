name: Delete merged branch

# Deletes a PR's branch once the PR is merged. Branches from forks and
# protected names are left alone; closed-without-merge PRs keep their branch.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const ref = context.payload.pull_request.head.ref;
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${ref}`,
              });
              core.info(`Deleted branch ${ref}`);
            } catch (err) {
              if (err.status === 422 || err.status === 404) {
                core.info(`Branch ${ref} was already deleted`);
              } else {
                throw err;
              }
            }
