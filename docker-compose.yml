# Runs MuJoCo in Docker and shows the viewer window on the host display.
#
# Windows 11 (Docker Desktop + WSLg): works with the defaults below.
# Linux host: run `xhost +local:docker`, then
#   X11_DIR=/tmp/.X11-unix docker compose up
services:
  mujoco:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: walking-hand-mujoco:3.17.0
    volumes:
      - .:/workspace
      - ${X11_DIR:-/run/desktop/mnt/host/wslg/.X11-unix}:/tmp/.X11-unix
    working_dir: /workspace
    environment:
      - DISPLAY=${DISPLAY_NUM:-:0}
      # Software OpenGL (Mesa llvmpipe). GPU passthrough into Docker on
      # Windows is unreliable; the hand scene is light enough for CPU.
      - LIBGL_ALWAYS_SOFTWARE=1
      # Makes the walking_hand package importable from the mounted repo.
      - PYTHONPATH=/workspace
    command: python scripts/view.py models/thing_hand/scene.xml
